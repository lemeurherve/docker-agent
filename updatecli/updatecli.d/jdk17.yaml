---
name: Bump JDK17 version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  lastVersion:
    kind: temurin
    name: Get the latest Adoptium JDK17 version via the API
    spec:
      featureversion: 17
    transformers:
      - trimprefix: "jdk-"
  lastVersionWithUnderscore:
    kind: temurin
    name: Get the latest Adoptium JDK17 version via the API with + replaced by _
    spec:
      featureversion: 17
    transformers:
      - trimprefix: "jdk-"
      - replacer:
          from: "+"
          to: "_"
  windows_x64_installer_url:
    name: Retrieve the latest Installer URL (ZIP) for Windows x64
    kind: temurin
    spec:
      architecture: x64
      featureversion: 17
      operatingsystem: windows
      releasetype: ga
      result: installer_url

conditions:
  checkTemurinAllReleases:
    name: Check if the "<lastVersion>" is available for all platforms
    kind: temurin
    sourceid: lastVersion
    spec:
      featureversion: 17
      platforms:
        - alpine-linux/x64
        - linux/x64
        - linux/aarch64
        - linux/ppc64le
        - linux/s390x
        - windows/x64
        - linux/arm
        - linux/riscv64

targets:
  setJDK17VersionDockerBake:
    name: "Bump JDK17 version for Linux images in the docker-bake.hcl file"
    kind: hcl
    sourceid: lastVersionWithUnderscore
    spec:
      file: docker-bake.hcl
      path: variable.JAVA17_VERSION.default
    scmid: default
  ## Update Dockerfiles default JAVA_VERSION argument as JDK17 is the current default Java version
  setJDK17VersionLinux:
    name: "Bump JDK17 default ARG version in Linux images"
    kind: dockerfile
    sourceid: lastVersionWithUnderscore
    spec:
      files:
        - alpine/Dockerfile
        - debian/Dockerfile
        - rhel/ubi9/Dockerfile
      instruction:
        keyword: ARG
        matcher: JAVA_VERSION
    scmid: default
  setJDK17WindowsInstallerUrl:
    name: Bump JDK17 Installer URL for Windows x64
    kind: json
    sourceid: windows_x64_installer_url
    spec:
      file: docker-bake.override.json
      engine: dasel/v2
      key: variable.jdk_installer_urls.default.windows.amd64.17
    scmid: default
  setJDK17VersionReadme:
    name: "Bump JDK17 version in README.md file"
    kind: file
    sourceid: lastVersionWithUnderscore
    spec:
      file: README.md
      matchpattern: '"JAVA_VERSION": "17\.[0-9]+\.[0-9]+[\+_][0-9]+"'
      replacepattern: '"JAVA_VERSION": "{{ source "lastVersionWithUnderscore" }}"'
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump JDK17 version to {{ source "lastVersionWithUnderscore" }}
    spec:
      labels:
        - dependencies
        - jdk17
